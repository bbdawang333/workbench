name: Intraday Stock Update

on:
  schedule:
    # 北京时间 09:30-14:30 每 30 分钟（UTC 01:30-06:30）
    - cron: '*/30 1-6 * * 1-5'
    # 北京时间 10:00-15:00 整点（UTC 02:00-07:00）
    - cron: '0 2-7 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate data.js (intraday)
        run: node generate_data.mjs --intraday

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "chore: intraday stock update" && git push)
